specification_version: post_stage4a_distance_band_sensitivity_spec_v2
authorization_record: metadata/post_stage4a_distance_band_sensitivity_authorization_v2.yml
supersedes_for_figure_refinement:
  specification: post_stage4a_distance_band_sensitivity_spec_v1
  historical_v1_outputs_overwritten: false
analysis_status: post_result_exploratory_estimand_refinement
scientific_question: >-
  Within successive 2 km source-point distance bands through 26 km, how does
  Bald Eagle checklist reporting or positive reported number change through
  herring-spawn timing relative to the same distance band's pre-spawn baseline?
population:
  region: SoG
  years: [2005, 2025]
  complete_checklists_only: true
  protocols: [stationary, traveling]
  duration_minutes: [5, 300]
  maximum_travel_distance_km: 5
  observer_count: [1, 10]
  maximum_source_point_link_distance_km: 26
  prospective_records_2026_plus: prohibited
taxon:
  common_name: Bald Eagle
  analysis_taxon_id: atx_fc0a9b777dcd
  family_membership_unchanged: true
outcomes:
  detection:
    family: binomial
    link: logit
    interpretation: checklist_reporting_not_occupancy
  positive_numeric_count_given_detection:
    family: gaussian_on_log_count
    interpretation: relative_reported_number_conditional_on_numeric_detection
  unquantified_X_as_numeric: prohibited
  ambiguity_as_zero: prohibited
periods:
  baseline: {minimum_day: -28, maximum_day: -15, duration_days: 14}
  early_pre: {minimum_day: -14, maximum_day: -8, duration_days: 7}
  immediate_pre: {minimum_day: -7, maximum_day: -1, duration_days: 7}
  spawn_start: {minimum_day: 0, maximum_day: 3, duration_days: 4}
  early_egg: {minimum_day: 4, maximum_day: 14, duration_days: 11}
  late_egg: {minimum_day: 15, maximum_day: 28, duration_days: 14}
distance_bands:
  band_0_2: {minimum_km_inclusive: 0, maximum_km_exclusive: 2}
  band_2_4: {minimum_km_inclusive: 2, maximum_km_exclusive: 4}
  band_4_6: {minimum_km_inclusive: 4, maximum_km_exclusive: 6}
  band_6_8: {minimum_km_inclusive: 6, maximum_km_exclusive: 8}
  band_8_10: {minimum_km_inclusive: 8, maximum_km_exclusive: 10}
  band_10_12: {minimum_km_inclusive: 10, maximum_km_exclusive: 12}
  band_12_14: {minimum_km_inclusive: 12, maximum_km_exclusive: 14}
  band_14_16: {minimum_km_inclusive: 14, maximum_km_exclusive: 16}
  band_16_18: {minimum_km_inclusive: 16, maximum_km_exclusive: 18}
  band_18_20: {minimum_km_inclusive: 18, maximum_km_exclusive: 20}
  band_20_22: {minimum_km_inclusive: 20, maximum_km_exclusive: 22}
  band_22_24: {minimum_km_inclusive: 22, maximum_km_exclusive: 24}
  band_24_26: {minimum_km_inclusive: 24, maximum_km_inclusive: 26}
adaptive_support_decision:
  candidate_interval_km: 2
  minimum_released_cell_size: 20
  rule: merge_adjacent_outer_intervals_if_any_term_below_threshold
  result: no_merging_required
  weakest_detection_term_rows: 1166
  weakest_conditional_count_term_rows: 736
  outer_20_26_weakest_detection_term_rows: 1681
  outer_20_26_weakest_conditional_count_term_rows: 864
  evidence:
    - outputs/post_stage4a_distance_band_sensitivity_v2_preflight/candidate_2km_model_term_support_v2.csv
    - outputs/post_stage4a_distance_band_sensitivity_v2_preflight/candidate_2km_band_minimum_support_v2.csv
link_extension:
  archived_0_20km_cache_reused_exactly: true
  new_links: greater_than_20_through_26_km
  archived_and_extended_link_keys_reconciled: required
  archived_20km_rounded_boundary_provenance_preserved: true
  ebd_membership_date_cache_reused: true
  raw_ebd_response_scan: prohibited
  protected_link_rows_committed: false
exposure_encoding:
  unit: linked_recorded_source_event
  joint_terms: period_by_distance_band_additive_counts
  independent_model_row: checklist
  checklist_duplication: prohibited
  all_78_joint_terms_in_model: true
  derive_joint_terms_by_multiplying_marginal_counts: prohibited
  concurrent_links: all_retained
model:
  engine_detection: lme4_glmer_nAGQ0
  engine_positive_count: lme4_lmer_REML
  fixed_terms:
    - all_78_joint_period_by_distance_band_counts
    - factor_checklist_year
    - protocol
    - log_duration_minutes
    - log_effort_distance_plus_one
    - observer_count
  random_intercepts:
    - herring_event_block
    - observer_cluster
    - generalized_location_cluster
  simplified_fallback: prohibited
contrasts:
  within_band_period_minus_baseline:
    expression: band_period_minus_same_band_baseline
    plotted_periods: [early_pre, immediate_pre, spawn_start, early_egg, late_egg]
  within_band_active_0_14:
    expression: >-
      (4 / 15) * band_spawn_start +
      (11 / 15) * band_early_egg -
      band_baseline
    plotted: false
inference:
  intervals: exact_model_covariance_normal_95_percent
  multiplicity: not_adjusted_single_taxon_exploratory_sensitivity
  interpretation: association_not_causal_effect_or_abundance
privacy:
  minimum_released_cell_size: 20
  protected_rows_committed: false
  identifiers_committed: false
  coordinates_committed: false
validation:
  exact_period_boundary_fixture: required
  exact_distance_boundary_fixture: required
  archived_link_reconciliation: required
  concurrent_link_joint_pairing_fixture: required
  event_metadata_join_cardinality: one_to_many_then_aggregate_to_one
  checklist_year_join_agreement: required
  model_geometry_and_singularity: fully_reported
  figure_visual_inspection: required
figure:
  layout: two_outcomes_by_two_distance_ranges
  left_range_km: [0, 12]
  right_range_km: [12, 26]
  distance_encoding: ordered_colour_plus_symbol_plus_line_type
  common_y_scale_within_outcome: true
output_directory: outputs/post_stage4a_distance_band_sensitivity_v2
final_gate: PASS_PENDING_HUMAN_BALD_EAGLE_26KM_DISTANCE_BAND_REVIEW
