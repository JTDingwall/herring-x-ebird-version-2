  adequate and increasing interval width if support is inadequate.
known_results_boundary:
  stage4a_results_known: true
  bald_eagle_distance_band_results_known: true
  classification: post_result_exploratory_estimand_refinement
  may_be_relabelled_prespecified_or_confirmatory: false
authorized_population:
  region: SoG
  start_year: 2005
  end_year: 2025
  prospective_records_2026_plus: prohibited
authorized_responses:
  - checklist_detection
  - positive_numeric_count_given_detection
authorized_taxa:
  included: [Glaucous-winged Gull]
  explicitly_excluded_from_refit: [Bald Eagle]
authorized_geometry:
  source_points_only: true
  candidate_2km_bands:
    - [0, 2]
    - [2, 4]
    - [4, 6]
    - [6, 8]
    - [8, 10]
    - [10, 12]
    - [12, 14]
    - [14, 16]
    - [16, 18]
    - [18, 20]
    - [20, 22]
    - [22, 24]
    - [24, 26]
