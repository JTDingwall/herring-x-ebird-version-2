authorization_version: post_stage4a_distance_band_sensitivity_authorization_v2
authorized_at_local: 2026-07-26
authorization_source: explicit_human_instruction_in_repository_session
scientific_decision: AUTHORIZE_BALD_EAGLE_DISTANCE_BAND_TIMING_SENSITIVITY_V2
human_instruction: >-
  Extend the Bald Eagle distance sensitivity analysis through 26 km. Retain
  successive 2 km intervals where model support is adequate; if outer intervals
  are too sparse, merge adjacent outer intervals rather than releasing unstable
  estimates.
known_results_boundary:
  stage4a_results_known: true
  v1_distance_band_results_known: true
  classification: post_result_exploratory_estimand_refinement
  may_be_relabelled_prespecified_or_confirmatory: false
authorized_population:
  region: SoG
  start_year: 2005
  end_year: 2025
  prospective_records_2026_plus: prohibited
authorized_responses:
  - checklist_detection
  - positive_numeric_count_given_detection
authorized_taxa:
  included: [Bald Eagle]
  explicitly_deferred_until_separate_instruction: [Glaucous-winged Gull]
authorized_geometry:
  source_points_only: true
  candidate_2km_bands:
    - [0, 2]
    - [2, 4]
    - [4, 6]
    - [6, 8]
    - [8, 10]
    - [10, 12]
    - [12, 14]
    - [14, 16]
    - [16, 18]
    - [18, 20]
    - [20, 22]
    - [22, 24]
    - [24, 26]
  upper_bound_26km_inclusive: true
  adaptive_outer_bin_rule: >-
    Starting at the outer edge, merge adjacent outer 2 km bands only when any
    registered timing term has fewer than 20 exposed model rows in either
    outcome. Lock the selected bands before fitting.
authorized_timing:
  baseline_days: [-28, -15]
  early_pre_days: [-14, -8]
  immediate_pre_days: [-7, -1]
  spawn_start_days: [0, 3]
  early_egg_days: [4, 14]
  late_egg_days: [15, 28]
analysis_constraints:
  independent_row: checklist
  concurrent_links: additive_joint_period_by_distance_band_counts
  all_concurrent_links_retained: true
  historical_v1_outputs_and_checkpoints: immutable
  historical_stage4a_outputs_and_checkpoints: immutable
  response_models_may_be_fit_only_after_concrete_v2_bands_are_committed: true
  manuscript_edits: prohibited
link_extension_constraints:
  reuse_stage3_linkage_implementation: required
  maximum_link_distance_km: 26
  ebd_response_fields_read: prohibited
  reuse_existing_ebd_membership_date_cache: required
